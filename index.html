<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SPOONMAN">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トイレ順番管理</title>

<style>
  html, body {
  height: 100%;
  overflow: hidden;
}

@media screen and (orientation: portrait) {
  body::before {
    content: "横向きで使用してください";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    z-index: 9999;
  }
}

body {
  margin: 0;
  font-family: sans-serif;
  background: #f0f4f8;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
}

h1 {
  font-size: 26px;
}

.adminBtn {
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  background: #ccc;
}

.container {
  display: flex;
  justify-content: space-around;
  padding: 15px;
}

.panel {
  width: 45%;
  background: #ffffff;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 5px 12px rgba(0,0,0,0.1);
}

.statusBox {
  font-size: 28px;
  padding: 15px;
  margin: 10px 0;
  border-radius: 15px;
}

.free {
  background: #d4edda;
}

.busy {
  background: #f8d7da;
}

.wait {
  font-size: 22px;
  margin-top: 10px;
}

button {
  width: 100%;
  font-size: 20px;
  padding: 14px;
  margin: 6px 0;
  border-radius: 12px;
  border: none;
  background: #a8dadc;
}

.hidden {
  display: none;
}
</style>
</head>

<body>
<div id="splash" style="
position: fixed;
top:0; left:0; right:0; bottom:0;
background:#f0f4f8;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
z-index:9999;">
SPOONMAN
</div>

<div class="header">
<h1 id="facilityName">SPOONMAN トイレ管理</h1>
<button class="adminBtn" onclick="enterAdmin()">🔒 管理</button>
</div>

<div class="container" id="mainView">

<div class="panel">
<h2>使用状況</h2>
<div id="okuBox" class="statusBox free">奥：空き</div>
<div id="temaeBox" class="statusBox free">手前：空き</div>
<div class="wait" id="wait">待ちなし</div>
</div>

<div class="panel">
<h2>受付</h2>
<button onclick="takeNumber('奥')">奥を希望</button>
<button onclick="takeNumber('手前')">手前を希望</button>
<button onclick="takeNumber('どちらでも')">どちらでも</button>

<h2>終了</h2>
<button onclick="finish('奥')">奥 使用終了</button>
<button onclick="finish('手前')">手前 使用終了</button>
</div>

</div>

<div id="adminView" class="hidden" style="padding:20px;">
<h2>管理画面</h2>

<div>本日 合計：<span id="totalCount">0</span></div>
<div>奥：<span id="okuCount">0</span></div>
<div>手前：<span id="temaeCount">0</span></div>

<br>

<button onclick="resetData()">本日データリセット</button>
<button onclick="exportCSV()">CSV出力</button>
<button onclick="exitAdmin()">戻る</button>
</div>

<script>
const ADMIN_PASS = "5811";

let today = new Date().toISOString().split("T")[0];
let savedDate = localStorage.getItem("date");

if (savedDate !== today) {
  localStorage.setItem("counter", "1");
  localStorage.setItem("date", today);
}

let counter = parseInt(localStorage.getItem("counter")) || 1;

let queue = [];
let okuUser = null;
let temaeUser = null;

let stats = JSON.parse(localStorage.getItem("toiletStats")) || {};
if (!stats[today]) {
  stats[today] = { total: 0, oku: 0, temae: 0 };
}

function saveAll() {
  localStorage.setItem("counter", counter);
  localStorage.setItem("toiletStats", JSON.stringify(stats));
}

function speak(text) {
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "ja-JP";
  speechSynthesis.speak(msg);
}

function takeNumber(type) {
  queue.push({number: counter, type: type});
  speak(counter + "番さん 受付しました");
  counter++;
  saveAll();
  assignToilet();
}

function assignToilet() {
  for (let i = 0; i < queue.length; i++) {
    let person = queue[i];

    if (!okuUser && (person.type === "奥" || person.type === "どちらでも")) {
      okuUser = person.number;
      queue.splice(i, 1);
      stats[today].total++;
      stats[today].oku++;
      speak(okuUser + "番さん 奥へどうぞ");
      break;
    }

    if (!temaeUser && (person.type === "手前" || person.type === "どちらでも")) {
      temaeUser = person.number;
      queue.splice(i, 1);
      stats[today].total++;
      stats[today].temae++;
      speak(temaeUser + "番さん 手前へどうぞ");
      break;
    }
  }
  saveAll();
  updateDisplay();
}

function finish(place) {
  if (place === "奥") okuUser = null;
  if (place === "手前") temaeUser = null;
  speak("使用終了しました");
  assignToilet();
}

function updateDisplay() {
  let okuBox = document.getElementById("okuBox");
  let temaeBox = document.getElementById("temaeBox");

  if (okuUser) {
    okuBox.className = "statusBox busy";
    okuBox.innerText = "奥：" + okuUser + "番 使用中";
  } else {
    okuBox.className = "statusBox free";
    okuBox.innerText = "奥：空き";
  }

  if (temaeUser) {
    temaeBox.className = "statusBox busy";
    temaeBox.innerText = "手前：" + temaeUser + "番 使用中";
  } else {
    temaeBox.className = "statusBox free";
    temaeBox.innerText = "手前：空き";
  }

  document.getElementById("wait").innerText =
    queue.length > 0 ? "待ち人数：" + queue.length + "人" : "待ちなし";

  document.getElementById("totalCount").innerText = stats[today].total;
  document.getElementById("okuCount").innerText = stats[today].oku;
  document.getElementById("temaeCount").innerText = stats[today].temae;
}

function enterAdmin() {
  const pass = prompt("パスコード");
  if (pass === ADMIN_PASS) {
    document.getElementById("mainView").classList.add("hidden");
    document.getElementById("adminView").classList.remove("hidden");
    updateDisplay();
  } else {
    alert("パスコードが違います");
  }
}

function exitAdmin() {
  document.getElementById("adminView").classList.add("hidden");
  document.getElementById("mainView").classList.remove("hidden");
}

function resetData() {
  if (confirm("本日のデータをリセットしますか？")) {
    stats[today] = { total: 0, oku: 0, temae: 0 };
    counter = 1;
    saveAll();
    updateDisplay();
  }
}

function exportCSV() {
  let csv = "日付,合計,奥,手前\n";
  for (let date in stats) {
    csv += date + "," + stats[date].total + "," + stats[date].oku + "," + stats[date].temae + "\n";
  }
  let blob = new Blob([csv], { type: "text/csv" });
  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "toilet_stats.csv";
  link.click();
}

updateDisplay();
  window.onload = function() {
  setTimeout(function() {
    document.getElementById("splash").style.display = "none";
  }, 1500);
};

</script>

</body>
</html>
