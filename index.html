<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SPトイレ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPトイレ">
<link rel="apple-touch-icon" href="icon.png">

<style>
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#f0f4f8; }
.header { text-align:center; padding:10px; font-size:22px; font-weight:bold; position:relative; }
.header button { position:absolute; right:10px; top:10px; padding:6px 10px; border:none; border-radius:8px; background:#ccc; }
.container { display:flex; flex-wrap:wrap; justify-content:space-around; padding:10px; }
.panel { background:#fff; border-radius:20px; padding:15px; margin:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1); flex:1 1 45%; min-width:300px; }
.statusBox { border-radius:15px; padding:15px; margin:8px 0; font-size:20px; text-align:center; }
.free { background:#d4edda; }
.busy { background:#f8d7da; }
button.actionBtn { border:none; border-radius:12px; padding:14px; margin:6px 0; font-size:18px; width:100%; background:#a8dadc; }
.hidden { display:none; }
#splash { position:fixed; top:0; left:0; right:0; bottom:0; background:#f0f4f8; display:flex; align-items:center; justify-content:center; font-size:32px; z-index:9999; }
@media screen and (orientation:portrait) {
  body::before { content:"横向きで使用してください"; position:fixed; top:0; left:0; right:0; bottom:0; background:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; z-index:9999; }
}
</style>
</head>

<body>
<div id="splash">SPトイレ</div>

<div class="header">SPトイレ
<button onclick="enterAdmin()">🔒</button>
</div>

<div id="mainView" class="container">
  <div class="panel" id="userPanel">
    <h3>利用者選択</h3>
    <div id="userList"></div>
  </div>
  <div class="panel">
    <h3>トイレ選択</h3>
    <button class="actionBtn" onclick="selectToilet('奥')">奥を希望</button>
    <button class="actionBtn" onclick="selectToilet('手前')">手前を希望</button>
    <button class="actionBtn" onclick="selectToilet('どちらでも')">どちらでも</button>
    <hr>
    <button class="actionBtn" onclick="finishUse()">使用終了</button>
    <div id="waitDisplay" style="text-align:center; margin-top:10px;">待機なし</div>
  </div>
</div>

<div id="adminView" class="hidden" style="padding:15px;">
<h3>管理者画面</h3>
<button onclick="exitAdmin()">戻る</button>
<hr>
<h4>利用者管理</h4>
<input type="text" id="newUserName" placeholder="名前を入力">
<button onclick="addUser()">追加</button>
<ul id="adminUserList"></ul>
<hr>
<h4>ログ（本日）</h4>
<button onclick="resetData()">リセット</button>
<button onclick="exportCSV()">CSV出力</button>
<div id="logDisplay"></div>
</div>

<script>
// 管理者パスワード
const ADMIN_PASS = "5811";

// スプラッシュ表示
window.onload = function() { setTimeout(()=>{document.getElementById('splash').style.display='none';},1500); }

let today = new Date().toISOString().split("T")[0];
if(localStorage.getItem("date")!==today){
  localStorage.setItem("date", today);
  localStorage.setItem("counter","1");
}
let counter = parseInt(localStorage.getItem("counter")||"1");
let selectedUser = null;
let selectedToilet = null;
let queue = [];
let inUse = {奥:null, 手前:null};
let logs = JSON.parse(localStorage.getItem("logs")||"{}");
if(!logs[today]) logs[today]=[];
let users = JSON.parse(localStorage.getItem("users")||"[]");

// 最大35人
if(users.length<35){
  for(let i=users.length;i<35;i++) users.push("利用者"+(i+1));
  saveUsers();
}

function saveUsers(){ localStorage.setItem("users", JSON.stringify(users)); }
function saveLogs(){ localStorage.setItem("logs", JSON.stringify(logs)); }
function saveCounter(){ localStorage.setItem("counter", counter); }

function renderUserList(){
  let ul = document.getElementById("userList"); ul.innerHTML="";
  users.forEach((name,i)=>{
    let btn = document.createElement("button");
    btn.innerText=name;
    btn.className="actionBtn";
    btn.onclick=()=>{ selectedUser=name; alert(name+"さんを選択"); };
    ul.appendChild(btn);
  });
}
function renderAdminUserList(){
  let ul=document.getElementById("adminUserList"); ul.innerHTML="";
  users.forEach((name,i)=>{
    let li=document.createElement("li");
    li.innerHTML=name+' <button onclick="editUser('+i+')">編集</button> <button onclick="delUser('+i+')">削除</button>';
    ul.appendChild(li);
  });
}

function addUser(){
  let val=document.getElementById("newUserName").value.trim();
  if(val && users.length<35){ users.push(val); saveUsers(); renderUserList(); renderAdminUserList(); document.getElementById("newUserName").value=""; }
}
function editUser(i){ let val=prompt("名前編集", users[i]); if(val){ users[i]=val; saveUsers(); renderUserList(); renderAdminUserList(); } }
function delUser(i){ if(confirm("削除しますか？")){ users.splice(i,1); saveUsers(); renderUserList(); renderAdminUserList(); } }

function selectToilet(type){
  if(!selectedUser){ alert("まず利用者を選択してください"); return; }
  selectedToilet=type;
  queue.push({user:selectedUser,toilet:type,time:Date.now()});
  selectedUser=null; selectedToilet=null;
  assignQueue();
  updateWait();
}

function assignQueue(){
  for(let i=0;i<queue.length;i++){
    let p = queue[i];

    // 奥を希望
    if(p.toilet==="奥" && !inUse["奥"]){
      inUse["奥"] = p.user;
      logs[today].push({user:p.user,toilet:"奥",start:new Date().toLocaleTimeString(),end:null});
      speak(p.user+"さん 奥トイレ どうぞ");
      queue.splice(i,1); i--; continue;
    }

    // 手前を希望
    if(p.toilet==="手前" && !inUse["手前"]){
      inUse["手前"] = p.user;
      logs[today].push({user:p.user,toilet:"手前",start:new Date().toLocaleTimeString(),end:null});
      speak(p.user+"さん 手前トイレ どうぞ");
      queue.splice(i,1); i--; continue;
    }

    // どちらでもの場合
    if(p.toilet==="どちらでも"){
      if(!inUse["奥"]){
        inUse["奥"]=p.user;
        logs[today].push({user:p.user,toilet:"奥",start:new Date().toLocaleTimeString(),end:null});
        speak(p.user+"さん 奥トイレ どうぞ");
        queue.splice(i,1); i--; continue;
      } else if(!inUse["手前"]){
        inUse["手前"]=p.user;
        logs[today].push({user:p.user,toilet:"手前",start:new Date().toLocaleTimeString(),end:null});
        speak(p.user+"さん 手前トイレ どうぞ");
        queue.splice(i,1); i--; continue;
      }
      // 両方埋まっていれば待機
    }
  }
  updateDisplay();
  updateWait();
  saveLogs();
}

function finishUse(){
  if(!selectedUser){ alert("まず利用者を選択してください"); return; }
  for(let t of ["奥","手前"]){
    if(inUse[t]===selectedUser){
      let log=logs[today].find(l=>l.user===selectedUser && l.toilet===t && !l.end);
      if(log) log.end=new Date().toLocaleTimeString();
      inUse[t]=null;
    }
  }
  assignQueue();
}

function updateDisplay(){
  let ubox=document.getElementById("userList");
  ["奥","手前"].forEach(t=>{
    let div=document.getElementById(t+"Box");
    if(!div){ div=document.createElement("div"); div.id=t+"Box"; div.className="statusBox free"; div.style.marginTop="5px"; ubox.parentNode.insertBefore(div, ubox); }
    if(inUse[t]){ div.innerText=t+"："+inUse[t]+"さん 使用中"; div.className="statusBox busy"; }
    else{ div.innerText=t+"：空き"; div.className="statusBox free"; }
  });
}

function updateWait(){
  let okuWait=queue.filter(p=>p.toilet==="奥"||p.toilet==="どちらでも").length;
  let temaeWait=queue.filter(p=>p.toilet==="手前"||p.toilet==="どちらでも").length;
  document.getElementById("waitDisplay").innerText=`奥待機: ${okuWait}人  手前待機: ${temaeWait}人`;
}

function updateAdminView(){
  renderAdminUserList();
  let logDiv=document.getElementById("logDisplay"); logDiv.innerHTML="";
  logs[today].forEach(l=>{ logDiv.innerHTML+=l.user+" "+l.toilet+" "+(l.start||"")+" → "+(l.end||"")+"<br>"; });
}

function enterAdmin(){
  let pass=prompt("パスワード"); 
  if(pass===ADMIN_PASS){
    document.getElementById("mainView").classList.add("hidden");
    document.getElementById("adminView").classList.remove("hidden");
    updateAdminView();
  }else{ alert("パスワード違います"); }
}
function exitAdmin(){ document.getElementById("adminView").classList.add("hidden"); document.getElementById("mainView").classList.remove("hidden"); }
function resetData(){ if(confirm("本日データをリセットしますか？")){ logs[today]=[]; inUse={奥:null,手前:null}; queue=[]; saveLogs(); updateDisplay(); updateWait(); updateAdminView(); } }
function exportCSV(){
  let csv="日付,利用者,トイレ,開始,終了\n";
  for(let d in logs){ logs[d].forEach(l=>{ csv+=d+","+l.user+","+l.toilet+","+l.start+","+l.end+"\n"; }); }
  let blob=new Blob([csv],{type:"text/csv"});
  let link=document.createElement("a"); link.href=URL.createObjectURL(blob); link.download="SPトイレ_logs.csv"; link.click();
}

function speak(text){ const msg=new SpeechSynthesisUtterance(text); msg.lang="ja-JP"; speechSynthesis.speak(msg); }

renderUserList();
renderAdminUserList();
updateDisplay();
updateWait();
</script>

</body>
</html>
