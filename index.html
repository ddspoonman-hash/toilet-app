<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>トイレ順番アプリ</title>
<style>
body {
  font-family: sans-serif;
  background: #f5f7fa;
  text-align: center;
  padding: 20px;
}
button {
  font-size: 28px;
  padding: 20px;
  margin: 10px;
  border-radius: 15px;
  border: none;
  background: #a8dadc;
}
.big {
  font-size: 40px;
}
</style>
</head>
<body>

<h1>トイレ じゅんばん</h1>

<div id="display" class="big">まちなし</div>

<br>

<button onclick="takeNumber()">じゅんばんをとる</button>
<button onclick="finishUse()">しよう しゅうりょう</button>

<script>
let queue = [];
let current = null;
let counter = 1;

function speak(text) {
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "ja-JP";
  speechSynthesis.speak(msg);
}

function takeNumber() {
  queue.push(counter);
  speak(counter + "ばんです");
  counter++;
  updateDisplay();
}

function finishUse() {
  if (current !== null) {
    speak("ありがとうございました");
  }
  nextPerson();
}

function nextPerson() {
  if (queue.length > 0) {
    current = queue.shift();
    speak(current + "ばんのかた どうぞ");
    updateDisplay();
  } else {
    current = null;
    updateDisplay();
  }
}

function updateDisplay() {
  if (current === null) {
    document.getElementById("display").innerText = "まちなし";
  } else {
    document.getElementById("display").innerText = current + "ばん しようちゅう";
  }
}
</script>

</body>
</html>
